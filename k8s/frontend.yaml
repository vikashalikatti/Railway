# Web app (nginx). It forwards /customer and /admin to the backend Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: railway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: railway-frontend:1.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
---
# LoadBalancer: Docker Desktop opens it on http://localhost:8081 (minikube: run "minikube tunnel")
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: railway
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 8081
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: railway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

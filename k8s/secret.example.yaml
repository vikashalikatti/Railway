# Copy to secret.yaml, put in your values, then: kubectl apply -f k8s/secret.yaml
# secret.yaml is ignored by git: never commit real passwords.
# (Or create it straight from the command line: see docs/DEPLOYMENT.md.)
apiVersion: v1
kind: Secret
metadata:
  name: railway-secrets
  namespace: railway
type: Opaque
stringData:
  DB_USERNAME: railway
  DB_PASSWORD: change-me-db-password
  MYSQL_ROOT_PASSWORD: change-me-root-password
  # Must be the same for every backend pod, or log-ins break when requests reach another pod
  JWT_SECRET: change-me-to-a-long-random-value
  MAIL_PASSWORD: your-16-letter-app-password

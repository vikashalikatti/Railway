# Railway API. Pods share nothing on disk (everything is in MySQL), so you can run several.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: railway
spec:
  # Start with 1 the first time (it creates the tables); then let the autoscaler add more
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: railway-backend:1.13.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: railway-config }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: railway-secrets, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: railway-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: railway-secrets, key: JWT_SECRET } }
            - name: MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: railway-secrets, key: MAIL_PASSWORD } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          # Spring Boot takes a while to start; the other checks wait for this one
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: railway
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
# More pods when the average CPU goes over 70% of what they asked for (needs metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: railway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://172.31.209.247:3306/railway_boot_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# Set DB_USERNAME and DB_PASSWORD on your computer (like MAIL_PASSWORD); the values after ":" are used otherwise
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
# SQL logging off: logs would otherwise contain passengers' details
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SPRING SECURITY
# ===============================
# Log-in tokens are signed with JWT_SECRET. Set it once to a long random value (at least 32 characters)
# so people stay logged in when the app restarts. Without it a random one is used on every start.
app.jwt.secret=${JWT_SECRET:}
# Web pages allowed to call this API from a browser (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
# Swagger UI / API docs: off unless set to true (they list every endpoint)
app.docs.public=${DOCS_PUBLIC:false}
springdoc.api-docs.enabled=${DOCS_PUBLIC:false}
springdoc.swagger-ui.enabled=${DOCS_PUBLIC:false}

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Uncomment if you want to see bind parameter values
 logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email_address
# Gmail App Password (Google Account > Security > App passwords). Set MAIL_PASSWORD on your computer;
# don't put the real value in this file.
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
# Never send stack traces or exception text to the browser
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
# Uploads: profile photos (5 MB, checked in code) and train lists for the admin's import (20 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Only the health check is exposed by actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false